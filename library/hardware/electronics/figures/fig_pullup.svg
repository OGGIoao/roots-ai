<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="100%" height="100%" fill="#fcfcfb"/>
<text x="380" y="24" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle">② 按钮的常见接法: 内部上拉 + 按钮接地</text>
<text x="200" y="60" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">松开: 上拉电阻把引脚拉到 3.3 V → 读 1</text>
<text x="100" y="92" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">3.3 V</text>
<path d="M100,102 L100,120" fill="none" stroke="#52514e" stroke-width="2"/>
<rect x="90" y="120" width="20" height="60" rx="2" fill="#fff7e6" stroke="#b06d00" stroke-width="1.5"/>
<text x="80" y="150" font-size="11" fill="#52514e" text-anchor="end" font-weight="normal" dominant-baseline="middle">45 kΩ</text>
<text x="80" y="166" font-size="10" fill="#8a8984" text-anchor="end" font-weight="normal" dominant-baseline="middle">(芯片内部)</text>
<path d="M100,180 L100,210" fill="none" stroke="#52514e" stroke-width="2"/>
<circle cx="100" cy="210" r="4" fill="#0b0b0b"/>
<path d="M100,210 L190,210" fill="none" stroke="#52514e" stroke-width="2"/>
<rect x="190" y="190" width="90" height="40" rx="4" fill="#dbe9f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="235.0" y="210.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">GPIO 5</text>
<text x="235" y="245" font-size="14" fill="#2a78d6" text-anchor="middle" font-weight="bold" dominant-baseline="middle">读 1</text>
<path d="M100,210 L100,240" fill="none" stroke="#52514e" stroke-width="2"/>
<path d="M100,240 L122,262" fill="none" stroke="#52514e" stroke-width="2"/>
<circle cx="100" cy="240" r="3" fill="#0b0b0b"/>
<path d="M100,270 L100,290" fill="none" stroke="#52514e" stroke-width="2"/>
<line x1="85" y1="290" x2="115" y2="290" stroke="#52514e" stroke-width="2.5"/>
<text x="130" y="290" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">GND</text>
<text x="140" y="252" font-size="11" fill="#8a8984" text-anchor="start" font-weight="normal" dominant-baseline="middle">按钮</text>
<text x="560" y="60" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">按下: 引脚被按钮直接接地 → 读 0</text>
<text x="460" y="92" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">3.3 V</text>
<path d="M460,102 L460,120" fill="none" stroke="#52514e" stroke-width="2"/>
<rect x="450" y="120" width="20" height="60" rx="2" fill="#fff7e6" stroke="#b06d00" stroke-width="1.5"/>
<text x="440" y="150" font-size="11" fill="#52514e" text-anchor="end" font-weight="normal" dominant-baseline="middle">45 kΩ</text>
<text x="440" y="166" font-size="10" fill="#8a8984" text-anchor="end" font-weight="normal" dominant-baseline="middle">(芯片内部)</text>
<path d="M460,180 L460,210" fill="none" stroke="#52514e" stroke-width="2"/>
<circle cx="460" cy="210" r="4" fill="#0b0b0b"/>
<path d="M460,210 L550,210" fill="none" stroke="#52514e" stroke-width="2"/>
<rect x="550" y="190" width="90" height="40" rx="4" fill="#dbe9f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="595.0" y="210.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">GPIO 5</text>
<text x="595" y="245" font-size="14" fill="#eb6834" text-anchor="middle" font-weight="bold" dominant-baseline="middle">读 0</text>
<path d="M460,210 L460,240" fill="none" stroke="#52514e" stroke-width="2"/>
<path d="M460,240 L460,270" fill="none" stroke="#eb6834" stroke-width="3"/>
<circle cx="460" cy="240" r="3" fill="#0b0b0b"/>
<path d="M460,270 L460,290" fill="none" stroke="#52514e" stroke-width="2"/>
<line x1="445" y1="290" x2="475" y2="290" stroke="#52514e" stroke-width="2.5"/>
<text x="490" y="290" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">GND</text>
<text x="500" y="252" font-size="11" fill="#8a8984" text-anchor="start" font-weight="normal" dominant-baseline="middle">按钮</text>
<text x="670" y="270" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal" dominant-baseline="middle">电流 3.3 V ÷ 45 kΩ ≈ 0.07 mA</text>
<text x="670" y="287" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal" dominant-baseline="middle">从上拉电阻流进地, 引脚 ≈ 0 V</text>
<text x="380" y="318" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">没有上拉电阻时, 松开的引脚什么都没接 (悬空), 读数不确定: 真板上会乱跳, Wokwi 里固定读 0</text>
</svg>
