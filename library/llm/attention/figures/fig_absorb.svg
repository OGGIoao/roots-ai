<rect x="496" y="84" width="20" height="13" rx="2" fill="#fde3d7" stroke="#eb6834" stroke-width="1"/>
<rect x="520" y="52" width="20" height="13" rx="2" fill="#fde3d7" stroke="#eb6834" stroke-width="1"/>
<rect x="520" y="68" width="20" height="13" rx="2" fill="#fde3d7" stroke="#eb6834" stroke-width="1"/>
<rect x="520" y="84" width="20" height="13" rx="2" fill="#fde3d7" stroke="#eb6834" stroke-width="1"/>
<rect x="544" y="52" width="20" height="13" rx="2" fill="#fde3d7" stroke="#eb6834" stroke-width="1"/>
<rect x="544" y="68" width="20" height="13" rx="2" fill="#fde3d7" stroke="#eb6834" stroke-width="1"/>
<rect x="544" y="84" width="20" height="13" rx="2" fill="#fde3d7" stroke="#eb6834" stroke-width="1"/>
<rect x="568" y="52" width="20" height="13" rx="2" fill="#fde3d7" stroke="#eb6834" stroke-width="1"/>
<rect x="568" y="68" width="20" height="13" rx="2" fill="#fde3d7" stroke="#eb6834" stroke-width="1"/>
<rect x="568" y="84" width="20" height="13" rx="2" fill="#fde3d7" stroke="#eb6834" stroke-width="1"/>
<rect x="592" y="52" width="20" height="13" rx="2" fill="#fde3d7" stroke="#eb6834" stroke-width="1"/>
<rect x="592" y="68" width="20" height="13" rx="2" fill="#fde3d7" stroke="#eb6834" stroke-width="1"/>
<rect x="592" y="84" width="20" height="13" rx="2" fill="#fde3d7" stroke="#eb6834" stroke-width="1"/>
<text x="544" y="112" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal" dominant-baseline="middle">每个头的 K、V (t 个位置)</text>
<line x1="622" y1="76" x2="670" y2="76" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="672" y="58" width="150" height="36" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/>
<text x="747.0" y="76.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">与 q 做注意力</text>
<line x1="822" y1="76" x2="860" y2="76" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="862" y="58" width="100" height="36" rx="4" fill="#efeeea" stroke="#52514e" stroke-width="1.5"/>
<text x="912.0" y="76.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">输出</text>
<text x="500" y="150" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">每生成一个 token 的计算量 ∝ t × r × H × (d_nope + d_v)  —— 随上下文长度线性增长, 而且乘了头数</text>
<line x1="20" y1="180" x2="980" y2="180" stroke="#e3e2dd" stroke-width="1"/>
<text x="20" y="210" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle">吸收解码: 把解压矩阵提前乘到 q 和输出上, 历史潜向量从不解压</text>
<rect x="40" y="248" width="60" height="36" rx="4" fill="#dbe9f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="70.0" y="266.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">q</text>
<line x1="100" y1="266" x2="140" y2="266" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="142" y="248" width="118" height="36" rx="4" fill="#efeeea" stroke="#52514e" stroke-width="1.5"/>
<text x="201.0" y="266.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">× W_ukᵀ</text>
<text x="201" y="298" font-size="11" fill="#008300" text-anchor="middle" font-weight="normal" dominant-baseline="middle">每步 1 次</text>
<line x1="260" y1="266" x2="300" y2="266" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="302" y="248" width="76" height="36" rx="4" fill="#dbe9f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="340.0" y="266.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">q_lat</text>
<text x="340.0" y="297" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal" dominant-baseline="middle">r 维</text>
<line x1="378" y1="266" x2="418" y2="266" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="420" y="238" width="150" height="56" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/>
<text x="495" y="258" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">点积 → softmax</text>
<text x="495" y="278" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">得到权重 a_j</text>
<rect x="410" y="350" width="28" height="28" rx="4" fill="#fde3d7" stroke="#eb6834" stroke-width="1.5"/>
<text x="424.0" y="364.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">c1</text>
<rect x="444" y="350" width="28" height="28" rx="4" fill="#fde3d7" stroke="#eb6834" stroke-width="1.5"/>
<text x="458.0" y="364.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">c2</text>
<rect x="478" y="350" width="28" height="28" rx="4" fill="#fde3d7" stroke="#eb6834" stroke-width="1.5"/>
<text x="492.0" y="364.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">c3</text>
<rect x="512" y="350" width="28" height="28" rx="4" fill="#fde3d7" stroke="#eb6834" stroke-width="1.5"/>
<text x="526.0" y="364.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">c4</text>
<rect x="546" y="350" width="28" height="28" rx="4" fill="#fde3d7" stroke="#eb6834" stroke-width="1.5"/>
<text x="560.0" y="364.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">c5</text>
<rect x="580" y="350" width="28" height="28" rx="4" fill="#fde3d7" stroke="#eb6834" stroke-width="1.5"/>
<text x="594.0" y="364.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">c6</text>
<rect x="402" y="342" width="214" height="44" rx="6" fill="none" stroke="#008300" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="510" y="404" font-size="11" fill="#008300" text-anchor="middle" font-weight="normal" dominant-baseline="middle">缓存里的 c (直接使用)</text>
<line x1="495" y1="342" x2="495" y2="296" stroke="#eb6834" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="570" y1="266" x2="610" y2="266" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="612" y="238" width="130" height="56" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/>
<text x="677" y="258" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">Σ a_j · c_j</text>
<text x="677" y="278" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">在潜空间加权求和</text>
<line x1="600" y1="352" x2="650" y2="296" stroke="#eb6834" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="742" y1="266" x2="772" y2="266" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="774" y="248" width="90" height="36" rx="4" fill="#efeeea" stroke="#52514e" stroke-width="1.5"/>
<text x="819.0" y="266.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">× W_uv</text>
<text x="819" y="298" font-size="11" fill="#008300" text-anchor="middle" font-weight="normal" dominant-baseline="middle">每步 1 次</text>
<line x1="864" y1="266" x2="894" y2="266" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="896" y="248" width="70" height="36" rx="4" fill="#efeeea" stroke="#52514e" stroke-width="1.5"/>
<text x="931.0" y="266.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">输出</text>
<text x="500" y="440" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">每生成一个 token 的计算量 ∝ t × r × H  —— 少了 (d_nope + d_v) 这个因子; 结果与朴素解码完全相同 (结合律)</text>
