<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="100%" height="100%" fill="#fcfcfb"/>
<text x="20" y="28" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle">朴素解码: 每一步把全部历史潜向量解压成每个头的 K、V</text>
<rect x="40" y="62" width="28" height="28" rx="4" fill="#fde3d7" stroke="#eb6834" stroke-width="1.5"/>
<text x="54.0" y="76.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">c1</text>
<rect x="74" y="62" width="28" height="28" rx="4" fill="#fde3d7" stroke="#eb6834" stroke-width="1.5"/>
<text x="88.0" y="76.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">c2</text>
<rect x="108" y="62" width="28" height="28" rx="4" fill="#fde3d7" stroke="#eb6834" stroke-width="1.5"/>
<text x="122.0" y="76.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">c3</text>
<rect x="142" y="62" width="28" height="28" rx="4" fill="#fde3d7" stroke="#eb6834" stroke-width="1.5"/>
<text x="156.0" y="76.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">c4</text>
<rect x="176" y="62" width="28" height="28" rx="4" fill="#fde3d7" stroke="#eb6834" stroke-width="1.5"/>
<text x="190.0" y="76.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">c5</text>
<rect x="210" y="62" width="28" height="28" rx="4" fill="#fde3d7" stroke="#eb6834" stroke-width="1.5"/>
<text x="224.0" y="76.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">c6</text>
<rect x="32" y="54" width="214" height="44" rx="6" fill="none" stroke="#008300" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="140" y="116" font-size="11" fill="#008300" text-anchor="middle" font-weight="normal" dominant-baseline="middle">缓存里的 c (t 个位置)</text>
<line x1="250" y1="76" x2="300" y2="76" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="302" y="58" width="120" height="36" rx="4" fill="#efeeea" stroke="#52514e" stroke-width="1.5"/>
<text x="362.0" y="76.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">× W_ukv</text>
<text x="362" y="108" font-size="11" fill="#e34948" text-anchor="middle" font-weight="normal" dominant-baseline="middle">t 个位置 × H 个头, 每步都做</text>
<line x1="422" y1="76" x2="470" y2="76" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="472" y="52" width="20" height="13" rx="2" fill="#fde3d7" stroke="#eb6834" stroke-width="1"/>
<rect x="472" y="68" width="20" height="13" rx="2" fill="#fde3d7" stroke="#eb6834" stroke-width="1"/>
