<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="100%" height="100%" fill="#fcfcfb"/>
<text x="20" y="22" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle">一步解码: 分数进来, 一个 token 出去; 接到后面, 再来一步</text>
<text x="20" y="42" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">每一步都只是 "改分数": 不想要的设成 -∞; 最后一步才真正挑。贪心跳过 ② ③, 但 ① 惩罚照做 (第 8.3 节)</text>
<rect x="30" y="120" width="90" height="54" rx="4" fill="#efeeea" stroke="#52514e" stroke-width="1.5"/>
<text x="75.0" y="140" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle">模型</text>
<text x="75.0" y="159" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">打分 (logits)</text>
<rect x="154" y="120" width="110" height="54" rx="4" fill="#fde3d7" stroke="#eb6834" stroke-width="1.5"/>
<text x="209.0" y="140" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle">① 惩罚</text>
<text x="209.0" y="159" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">说过的压低</text>
<rect x="298" y="120" width="100" height="54" rx="4" fill="#dbe9f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="348.0" y="140" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle">② 温度</text>
<text x="348.0" y="159" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">除以 T</text>
<rect x="432" y="120" width="150" height="54" rx="4" fill="#dbe9f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="507.0" y="140" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle">③ 截断</text>
<text x="507.0" y="159" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">top-k / top-p / min-p</text>
<rect x="616" y="120" width="150" height="54" rx="4" fill="#dcf3e9" stroke="#1baf7a" stroke-width="1.5"/>
<text x="691.0" y="140" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle">④ 挑一个</text>
<text x="691.0" y="159" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">贪心取最大 / 按概率抽</text>
<rect x="800" y="120" width="160" height="54" rx="4" fill="#efeeea" stroke="#52514e" stroke-width="1.5"/>
<text x="880.0" y="140" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle">停不停?</text>
<text x="880.0" y="159" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">停止 token / 字符串 / 长度</text>
<line x1="122" y1="147.0" x2="151" y2="147.0" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="266" y1="147.0" x2="295" y2="147.0" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="400" y1="147.0" x2="429" y2="147.0" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="584" y1="147.0" x2="613" y2="147.0" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="768" y1="147.0" x2="797" y2="147.0" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M880.0,174 L880.0,234 L75.0,234 L75.0,178" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="495.0" y="248" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">不停: 把挑中的 token 接到输入后面, 再问模型下一步 (这就是 generate.py 的循环)</text>
<text x="880.0" y="106" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle">停 → 输出</text>
<rect x="290" y="86" width="300" height="100" rx="8" fill="none" stroke="#8a8984" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="440.0" y="98" font-size="12" fill="#8a8984" text-anchor="middle" font-weight="normal" dominant-baseline="middle">贪心 (do_sample=False) 跳过 ② ③</text>
<text x="209.0" y="98" font-size="12" fill="#eb6834" text-anchor="middle" font-weight="bold" dominant-baseline="middle">贪心也照做</text>
</svg>
