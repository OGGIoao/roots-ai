<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 270" width="940" height="270" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="100%" height="100%" fill="#fcfcfb"/>
<text x="20" y="22" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle">什么时候停: 三种停止条件 (generate.py)</text>
<text x="20" y="42" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">停止原因要记下来: 以 length 结束的工具调用, 往往是 JSON 写到一半被截断</text>
<text x="140" y="87" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="bold" dominant-baseline="middle">stop_token</text>
<rect x="160" y="70" width="35" height="34" rx="4" fill="#dbe9f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="177.5" y="87" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">台</text>
<rect x="201" y="70" width="35" height="34" rx="4" fill="#dbe9f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="218.5" y="87" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">北</text>
<rect x="242" y="70" width="44" height="34" rx="4" fill="#dbe9f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="264.0" y="87" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">26</text>
<rect x="292" y="70" width="35" height="34" rx="4" fill="#dbe9f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="309.5" y="87" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">度</text>
<rect x="333" y="70" width="116" height="34" rx="4" fill="#fde3d7" stroke="#eb6834" stroke-width="1.5"/>
<text x="391.0" y="87" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">&lt;|im_end|&gt;</text>
<text x="469" y="87" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">生成了停止 token; 输出里包含它</text>
<text x="140" y="151" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="bold" dominant-baseline="middle">stop_string</text>
<rect x="160" y="134" width="35" height="34" rx="4" fill="#dbe9f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="177.5" y="151" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">第</text>
<rect x="201" y="134" width="35" height="34" rx="4" fill="#dbe9f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="218.5" y="151" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">一</text>
<rect x="242" y="134" width="35" height="34" rx="4" fill="#dbe9f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="259.5" y="151" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">段</text>
<rect x="283" y="134" width="44" height="34" rx="4" fill="#fde3d7" stroke="#eb6834" stroke-width="1.5"/>
<text x="305.0" y="151" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">\n</text>
<rect x="333" y="134" width="44" height="34" rx="4" fill="#fde3d7" stroke="#eb6834" stroke-width="1.5"/>
<text x="355.0" y="151" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">\n</text>
<text x="397" y="151" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">新文字里出现了 "\n\n"; transformers 保留, vLLM 默认去掉</text>
<text x="140" y="215" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="bold" dominant-baseline="middle">length</text>
<rect x="160" y="198" width="44" height="34" rx="4" fill="#dbe9f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="182.0" y="215" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">{"</text>
<rect x="210" y="198" width="62" height="34" rx="4" fill="#dbe9f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="241.0" y="215" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">city</text>
<rect x="278" y="198" width="44" height="34" rx="4" fill="#dbe9f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="300.0" y="215" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">":</text>
<rect x="328" y="198" width="44" height="34" rx="4" fill="#dbe9f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="350.0" y="215" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle"> "</text>
<rect x="378" y="198" width="35" height="34" rx="4" fill="#dbe9f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="395.5" y="215" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">台</text>
<text x="423" y="215" font-size="14" fill="#eb6834" text-anchor="start" font-weight="bold" dominant-baseline="middle">… ✂</text>
<text x="463" y="215" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">写满 max_new_tokens=5 还没停: 半截 JSON</text>
</svg>
