<text x="480" y="340" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">贪心 (束宽 1) 只看眼前一步; 束宽 2 会保留一条 "现在稍差、后面可能更好" 的路</text>
