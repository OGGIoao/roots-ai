<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="100%" height="100%" fill="#fcfcfb"/>
<text x="20" y="22" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle">关掉思考, 模板替模型写好一个空的 &lt;think&gt;&lt;/think&gt;: 模型 "以为" 自己已经想完了</text>
<text x="20" y="42" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">同一个问题 "3 乘 9 是多少?" 的生成提示结尾 (experiments/thinking_templates.py); gpt-oss 的开关不在这里, 在系统消息的 "Reasoning: low / medium / high" 一行</text>
<rect x="20" y="66" width="920" height="50" rx="4" fill="#efeeea" stroke="#52514e" stroke-width="1.5"/>
<text x="32" y="80" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle">Qwen3, 默认</text>
<text x="32" y="101" font-size="11" font-family="Consolas,'Courier New',monospace" dominant-baseline="middle"><tspan fill="#0b0b0b">…</tspan><tspan fill="#eb6834" font-weight="bold">&lt;|im_start|&gt;</tspan><tspan fill="#0b0b0b">user↵3 乘 9 是多少?</tspan><tspan fill="#eb6834" font-weight="bold">&lt;|im_end|&gt;</tspan><tspan fill="#0b0b0b">↵</tspan><tspan fill="#eb6834" font-weight="bold">&lt;|im_start|&gt;</tspan><tspan fill="#0b0b0b">assistant↵</tspan></text>
<rect x="20" y="128" width="920" height="50" rx="4" fill="#fde3d7" stroke="#eb6834" stroke-width="1.5"/>
<text x="32" y="142" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle">Qwen3, enable_thinking=False</text>
<text x="32" y="163" font-size="11" font-family="Consolas,'Courier New',monospace" dominant-baseline="middle"><tspan fill="#0b0b0b">…</tspan><tspan fill="#eb6834" font-weight="bold">&lt;|im_start|&gt;</tspan><tspan fill="#0b0b0b">user↵3 乘 9 是多少?</tspan><tspan fill="#eb6834" font-weight="bold">&lt;|im_end|&gt;</tspan><tspan fill="#0b0b0b">↵</tspan><tspan fill="#eb6834" font-weight="bold">&lt;|im_start|&gt;</tspan><tspan fill="#0b0b0b">assistant↵</tspan><tspan fill="#eb6834" font-weight="bold">&lt;think&gt;</tspan><tspan fill="#0b0b0b">↵↵</tspan><tspan fill="#eb6834" font-weight="bold">&lt;/think&gt;</tspan><tspan fill="#0b0b0b">↵↵</tspan></text>
<rect x="20" y="190" width="920" height="50" rx="4" fill="#efeeea" stroke="#52514e" stroke-width="1.5"/>
<text x="32" y="204" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle">GLM-4.5, 默认</text>
<text x="32" y="225" font-size="11" font-family="Consolas,'Courier New',monospace" dominant-baseline="middle"><tspan fill="#0b0b0b">…</tspan><tspan fill="#eb6834" font-weight="bold">[gMASK]</tspan><tspan fill="#eb6834" font-weight="bold">&lt;sop&gt;</tspan><tspan fill="#eb6834" font-weight="bold">&lt;|user|&gt;</tspan><tspan fill="#0b0b0b">↵3 乘 9 是多少?</tspan><tspan fill="#eb6834" font-weight="bold">&lt;|assistant|&gt;</tspan></text>
<rect x="20" y="252" width="920" height="50" rx="4" fill="#fde3d7" stroke="#eb6834" stroke-width="1.5"/>
<text x="32" y="266" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle">GLM-4.5, enable_thinking=False</text>
<text x="32" y="287" font-size="11" font-family="Consolas,'Courier New',monospace" dominant-baseline="middle"><tspan fill="#0b0b0b">…</tspan><tspan fill="#eb6834" font-weight="bold">[gMASK]</tspan><tspan fill="#eb6834" font-weight="bold">&lt;sop&gt;</tspan><tspan fill="#eb6834" font-weight="bold">&lt;|user|&gt;</tspan><tspan fill="#0b0b0b">↵3 乘 9 是多少?</tspan><tspan fill="#eb6834" font-weight="bold">/nothink</tspan><tspan fill="#eb6834" font-weight="bold">&lt;|assistant|&gt;</tspan><tspan fill="#0b0b0b">↵</tspan><tspan fill="#eb6834" font-weight="bold">&lt;think&gt;</tspan><tspan fill="#eb6834" font-weight="bold">&lt;/think&gt;</tspan></text>
</svg>
