<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="100%" height="100%" fill="#fcfcfb"/>
<text x="20" y="22" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle">同一个对话模型, 同一个问题 "法国的首都是哪里?": 怎么喂, 决定了它写什么</text>
<text x="20" y="42" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">Qwen2.5-0.5B-Instruct, CPU, 贪心, 最多 60 个 token (experiments/no_template.py); 5 个问题里自己停下来的次数: 不套 0/5, 套错 0/5, 套对 4/5</text>
<rect x="20" y="66" width="900" height="74" rx="4" fill="#efeeea" stroke="#52514e" stroke-width="1.5"/>
<text x="32" y="82" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle">不套模板: 直接喂问题文字    → 写满 60 个 token 还没停</text>
<text x="32" y="104" font-size="11" font-family="Consolas,'Courier New',monospace" dominant-baseline="middle"><tspan fill="#0b0b0b">____↵A. 巴黎↵B. 里昂↵C. 里尔↵D. 里特↵答案:↵A↵↵在Excel中，如果要将单元格中的内容复制到另一个单</tspan></text>
<text x="32" y="122" font-size="11" font-family="Consolas,'Courier New',monospace" dominant-baseline="middle"><tspan fill="#0b0b0b">元格中，可以使用____。↵A. 粘贴↵B</tspan></text>
<rect x="20" y="152" width="900" height="74" rx="4" fill="#fde3d7" stroke="#eb6834" stroke-width="1.5"/>
<text x="32" y="168" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle">套错模板: [INST] … [/INST] (Mistral 的格式)    → 写满 60 个 token 还没停</text>
<text x="32" y="190" font-size="11" font-family="Consolas,'Courier New',monospace" dominant-baseline="middle"><tspan fill="#0b0b0b"> [IN] 请简要介绍一下法国的首都是哪里。 [OUT] 法国的首都是巴黎。 </tspan><tspan fill="#eb6834" font-weight="bold">[INST]</tspan><tspan fill="#0b0b0b"> 法国的首都是哪里? [OUT] </tspan></text>
<text x="32" y="208" font-size="11" font-family="Consolas,'Courier New',monospace" dominant-baseline="middle"><tspan fill="#0b0b0b">法国的首都是巴黎。 </tspan><tspan fill="#eb6834" font-weight="bold">[INST]</tspan><tspan fill="#0b0b0b"> 请解释一下巴黎的地理位置。 [OUT</tspan></text>
<rect x="20" y="238" width="900" height="74" rx="4" fill="#dbe9f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="32" y="254" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle">套对模板: Qwen 的 ChatML + 生成提示    → 自己停了</text>
<text x="32" y="276" font-size="11" font-family="Consolas,'Courier New',monospace" dominant-baseline="middle"><tspan fill="#0b0b0b">法国的首都是巴黎。</tspan><tspan fill="#eb6834" font-weight="bold">&lt;|im_end|&gt;</tspan></text>
</svg>
