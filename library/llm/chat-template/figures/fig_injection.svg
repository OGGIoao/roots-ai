<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="100%" height="100%" fill="#fcfcfb"/>
<text x="20" y="22" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle">用户文字里写了 "&lt;|im_end|&gt;…&lt;|im_start|&gt;system": 默认分词会把它当成真的特殊标记</text>
<text x="20" y="42" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">同一段用户输入的两种分法 (experiments/measure_tokens.py); 橙框 = 特殊 token, 在模型眼里就是结构</text>
<text x="20" y="80" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle">默认分词: 11 个 token, 其中 2 个是真的特殊标记 → 模型以为用户消息到 "忽略上面" 就结束了, 后面是一条 system</text>
