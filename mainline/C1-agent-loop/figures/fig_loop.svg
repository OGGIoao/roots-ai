<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="100%" height="100%" fill="#fcfcfb"/>
<text x="20" y="22" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle">Agent 循环: 大模型只负责"说要做什么", 做没做、做成什么样, 由循环把结果喂回去</text>
<text x="20" y="42" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">agent.py 的 run_episode; 一轮 = 问一次模型 + 执行它这一轮的工具调用</text>
<rect x="30" y="70" width="230" height="290" rx="4" fill="#efeeea" stroke="#52514e" stroke-width="1.5"/>
<text x="145" y="88" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle">对话 messages</text>
<rect x="42" y="101" width="206" height="24" rx="3" fill="#ffffff" stroke="#8a8984" stroke-width="0.8"/>
<text x="50" y="113" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">system</text>
<text x="112" y="113" font-size="10" fill="#0b0b0b" text-anchor="start" font-weight="normal" dominant-baseline="middle">场地、工具用法、成功标准</text>
<rect x="42" y="131" width="206" height="24" rx="3" fill="#ffffff" stroke="#8a8984" stroke-width="0.8"/>
<text x="50" y="143" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">user</text>
<text x="112" y="143" font-size="10" fill="#0b0b0b" text-anchor="start" font-weight="normal" dominant-baseline="middle">"去红杯子那里, 停在它跟前"</text>
<rect x="42" y="161" width="206" height="24" rx="3" fill="#dbe9f9" stroke="#8a8984" stroke-width="0.8"/>
<text x="50" y="173" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">assistant</text>
<text x="112" y="173" font-size="10" fill="#0b0b0b" text-anchor="start" font-weight="normal" dominant-baseline="middle">tool_calls: look()</text>
<rect x="42" y="191" width="206" height="24" rx="3" fill="#dcf3e9" stroke="#8a8984" stroke-width="0.8"/>
<text x="50" y="203" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">tool</text>
<text x="112" y="203" font-size="10" fill="#0b0b0b" text-anchor="start" font-weight="normal" dominant-baseline="middle">{objects: [red_cup 0.9m -12°]}</text>
<rect x="42" y="221" width="206" height="24" rx="3" fill="#dbe9f9" stroke="#8a8984" stroke-width="0.8"/>
<text x="50" y="233" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">assistant</text>
<text x="112" y="233" font-size="10" fill="#0b0b0b" text-anchor="start" font-weight="normal" dominant-baseline="middle">tool_calls: turn(-12)</text>
<rect x="42" y="251" width="206" height="24" rx="3" fill="#dcf3e9" stroke="#8a8984" stroke-width="0.8"/>
<text x="50" y="263" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">tool</text>
<text x="112" y="263" font-size="10" fill="#0b0b0b" text-anchor="start" font-weight="normal" dominant-baseline="middle">{ok: true}</text>
<rect x="42" y="281" width="206" height="24" rx="3" fill="#ffffff" stroke="#8a8984" stroke-width="0.8"/>
<text x="50" y="293" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">…</text>
<text x="112" y="293" font-size="10" fill="#0b0b0b" text-anchor="start" font-weight="normal" dominant-baseline="middle">越来越长</text>
<rect x="42" y="311" width="206" height="24" rx="3" fill="#dbe9f9" stroke="#8a8984" stroke-width="0.8"/>
<text x="50" y="323" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">assistant</text>
<text x="112" y="323" font-size="10" fill="#0b0b0b" text-anchor="start" font-weight="normal" dominant-baseline="middle">"已到达红杯子跟前"</text>
<rect x="330" y="90" width="170" height="60" rx="4" fill="#dbe9f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="415.0" y="120.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">大模型</text>
<text x="415" y="162" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal" dominant-baseline="middle">llm.chat(messages, tools)</text>
<line x1="260" y1="120" x2="328" y2="120" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="294" y="110" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">全部</text>
<rect x="580" y="70" width="230" height="40" rx="4" fill="#efeeea" stroke="#52514e" stroke-width="1.5"/>
<text x="695.0" y="90.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">只说话 → 结束</text>
<rect x="580" y="140" width="230" height="40" rx="4" fill="#dbe9f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="695.0" y="160.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">tool_calls → 执行</text>
<line x1="500" y1="112" x2="578" y2="92" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="500" y1="128" x2="578" y2="158" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="580" y="220" width="230" height="46" rx="4" fill="#fde3d7" stroke="#eb6834" stroke-width="1.5"/>
<text x="695.0" y="243.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">安全层 validate_call</text>
<text x="695" y="278" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">工具名、参数、范围不对 → 不执行, 回错误说明</text>
<line x1="695" y1="180" x2="695" y2="218" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="580" y="300" width="230" height="46" rx="4" fill="#dcf3e9" stroke="#1baf7a" stroke-width="1.5"/>
<text x="695.0" y="323.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">小车 (sim/car2d.py)</text>
<text x="695" y="358" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">动作有误差; look 有噪声和遮挡</text>
<line x1="695" y1="288" x2="695" y2="298" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M578,323 L330,323 L262,323" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="420" y="312" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">观测 (role=tool, tool_call_id 对上)</text>
<text x="420" y="338" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">追加进对话, 下一轮模型就能看到</text>
</svg>
