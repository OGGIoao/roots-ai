<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="100%" height="100%" fill="#fcfcfb"/>
<text x="20" y="26" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle">训练 train()  —— 只做一次, 产出 merges 和 vocab</text>
<rect x="20" y="48" width="150" height="46" rx="4" fill="#dbe9f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="95.0" y="71.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">训练语料</text>
<text x="95.0" y="107" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal" dominant-baseline="middle">莎士比亚 100 万字符</text>
<line x1="170" y1="71" x2="203" y2="71" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="205" y="48" width="150" height="46" rx="4" fill="#efeeea" stroke="#52514e" stroke-width="1.5"/>
<text x="280.0" y="71.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">预分词</text>
<text x="280.0" y="107" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal" dominant-baseline="middle">切成不跨词的片段</text>
<line x1="355" y1="71" x2="388" y2="71" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="390" y="48" width="160" height="46" rx="4" fill="#efeeea" stroke="#52514e" stroke-width="1.5"/>
<text x="470.0" y="71.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">词频表</text>
<text x="470.0" y="107" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal" dominant-baseline="middle">{字节元组: 次数}</text>
<line x1="550" y1="71" x2="583" y2="71" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="585" y="42" width="210" height="58" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/>
<text x="690" y="60" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">重复 vocab_size − 256 次</text>
<text x="690" y="82" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle">数 pair → 合并最高频的</text>
<line x1="795" y1="71" x2="828" y2="71" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="830" y="48" width="130" height="46" rx="4" fill="#fde3d7" stroke="#eb6834" stroke-width="1.5"/>
<text x="895.0" y="71.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">merges + vocab</text>
<text x="895.0" y="107" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal" dominant-baseline="middle">存进 tokenizer.json</text>
<text x="20" y="152" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle">编码 encode()  —— 每次用</text>
<rect x="20" y="172" width="150" height="46" rx="4" fill="#dbe9f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="95.0" y="195.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">"Hello world"</text>
<line x1="170" y1="195" x2="203" y2="195" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="205" y="172" width="150" height="46" rx="4" fill="#efeeea" stroke="#52514e" stroke-width="1.5"/>
<text x="280.0" y="195.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">预分词</text>
<text x="280.0" y="231" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal" dominant-baseline="middle">["Hello", "␣world"]</text>
<line x1="355" y1="195" x2="388" y2="195" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="390" y="172" width="160" height="46" rx="4" fill="#efeeea" stroke="#52514e" stroke-width="1.5"/>
<text x="470.0" y="195.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">UTF-8 字节</text>
<text x="470.0" y="231" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal" dominant-baseline="middle">[72, 101, 108, 108, 111] ...</text>
<line x1="550" y1="195" x2="583" y2="195" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="585" y="172" width="210" height="46" rx="4" fill="#efeeea" stroke="#52514e" stroke-width="1.5"/>
<text x="690.0" y="195.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">按 rank 从小到大合并</text>
<text x="690.0" y="231" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal" dominant-baseline="middle">只用 merges</text>
<line x1="795" y1="195" x2="828" y2="195" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="830" y="172" width="130" height="46" rx="4" fill="#dbe9f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="895.0" y="195.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">token ID 列表</text>
<path d="M895,124 L895,150 L690,150 L690,170" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="20" y="276" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle">解码 decode()  —— 不需要 merges</text>
<rect x="20" y="296" width="150" height="46" rx="4" fill="#dbe9f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="95.0" y="319.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">token ID 列表</text>
<line x1="170" y1="319" x2="203" y2="319" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="205" y="296" width="345" height="46" rx="4" fill="#efeeea" stroke="#52514e" stroke-width="1.5"/>
<text x="377.5" y="319.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">查 vocab: 每个 ID → 它代表的字节, 全部拼起来</text>
<line x1="550" y1="319" x2="583" y2="319" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="585" y="296" width="210" height="46" rx="4" fill="#efeeea" stroke="#52514e" stroke-width="1.5"/>
<text x="690.0" y="319.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">bytes.decode('utf-8')</text>
<line x1="795" y1="319" x2="828" y2="319" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="830" y="296" width="130" height="46" rx="4" fill="#dbe9f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="895.0" y="319.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">"Hello world"</text>
</svg>
