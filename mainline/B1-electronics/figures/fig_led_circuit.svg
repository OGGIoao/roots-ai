<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="100%" height="100%" fill="#fcfcfb"/>
<text x="380" y="24" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle">① 点灯: 引脚 → 电阻 → LED → 地, 电流处处相等</text>
<rect x="30" y="90" width="120" height="90" rx="4" fill="#dbe9f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="90.0" y="135.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">ESP32-S3</text>
<text x="90" y="160" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">GPIO 4 = 3.3 V</text>
<path d="M150,135 L230,135" fill="none" stroke="#52514e" stroke-width="2"/>
<rect x="230" y="124.0" width="80" height="22" rx="2" fill="#fff7e6" stroke="#b06d00" stroke-width="1.5"/>
<text x="270.0" y="112.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">R = 270 Ω</text>
<text x="270.0" y="159.0" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal" dominant-baseline="middle">压降 3.3 − 2.0 = 1.3 V</text>
<path d="M310,135 L400,135" fill="none" stroke="#52514e" stroke-width="2"/>
<polygon points="400,115 400,155 440,135" fill="#fde3d7" stroke="#eb6834" stroke-width="2"/>
<line x1="440" y1="115" x2="440" y2="155" stroke="#eb6834" stroke-width="2.5"/>
<line x1="425" y1="108" x2="437" y2="96" stroke="#eb6834" stroke-width="1.5"/>
<line x1="433" y1="112" x2="445" y2="100" stroke="#eb6834" stroke-width="1.5"/>
<text x="420" y="175" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal" dominant-baseline="middle">红色 LED, 压降约 2.0 V</text>
<path d="M440,135 L520,135 L520,230" fill="none" stroke="#52514e" stroke-width="2"/>
<line x1="500" y1="230" x2="540" y2="230" stroke="#52514e" stroke-width="2.5"/>
<line x1="507" y1="237" x2="533" y2="237" stroke="#52514e" stroke-width="2"/>
<line x1="514" y1="244" x2="526" y2="244" stroke="#52514e" stroke-width="1.5"/>
<text x="560" y="237" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">GND (0 V)</text>
<rect x="580" y="80" width="160" height="110" rx="4" fill="#efeeea" stroke="#52514e" stroke-width="1.5"/>
<text x="660" y="102" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">I = 1.3 V ÷ 270 Ω</text>
<text x="660" y="125" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle">= 4.81 mA</text>
<text x="660" y="150" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal" dominant-baseline="middle">最高驱动档典型 40 mA</text>
<text x="660" y="168" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal" dominant-baseline="middle">(数据手册表 5-4)</text>
<text x="380" y="280" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">不串电阻: 电流只受引脚内阻和 LED 自身限制, 可能远超额定值, 烧坏 LED 或引脚</text>
</svg>
