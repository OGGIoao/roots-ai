<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="100%" height="100%" fill="#fcfcfb"/>
<text x="380" y="24" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle">② 引脚怎么判断 0 和 1: 中间有一段"未定义"</text>
<rect x="80.0" y="90" width="150.0" height="60" rx="0" fill="#dbe9f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="155.0" y="114" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">低电平 → 读 0</text>
<text x="155.0" y="134" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">≤ 0.25 × VDD = 0.83 V</text>
<rect x="230.0" y="90" width="300.0" height="60" rx="0" fill="#fde3d7" stroke="#eb6834" stroke-width="1.5"/>
<text x="380.0" y="114" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">未定义: 读 0 还是 1 都有可能</text>
<text x="380.0" y="134" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">0.83 ~ 2.48 V</text>
<rect x="530.0" y="90" width="150.0" height="60" rx="0" fill="#d8f2e7" stroke="#1baf7a" stroke-width="1.5"/>
<text x="605.0" y="114" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">高电平 → 读 1</text>
<text x="605.0" y="134" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">≥ 0.75 × VDD = 2.48 V</text>
<line x1="80.0" y1="150" x2="80.0" y2="158" stroke="#52514e" stroke-width="1.4"/>
<text x="80.0" y="172" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal" dominant-baseline="middle">0 V</text>
<line x1="230.9090909090909" y1="150" x2="230.9090909090909" y2="158" stroke="#52514e" stroke-width="1.4"/>
<text x="230.9090909090909" y="172" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal" dominant-baseline="middle">0.83 V</text>
<line x1="380.0" y1="150" x2="380.0" y2="158" stroke="#52514e" stroke-width="1.4"/>
<text x="380.0" y="172" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal" dominant-baseline="middle">1.65 V</text>
<line x1="530.909090909091" y1="150" x2="530.909090909091" y2="158" stroke="#52514e" stroke-width="1.4"/>
<text x="530.909090909091" y="172" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal" dominant-baseline="middle">2.48 V</text>
<line x1="680.0" y1="150" x2="680.0" y2="158" stroke="#52514e" stroke-width="1.4"/>
<text x="680.0" y="172" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal" dominant-baseline="middle">3.3 V</text>
<text x="380" y="200" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">数据手册表 5-4 (VDD = 3.3 V): VIL 最大 0.25 × VDD, VIH 最小 0.75 × VDD</text>
<text x="380" y="222" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">悬空的引脚电压可能落在中间这一段, 所以读数不可信; 上拉/下拉电阻把它固定在两端之一</text>
</svg>
