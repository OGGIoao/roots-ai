<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="100%" height="100%" fill="#fcfcfb"/>
<text x="20" y="24" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle">数据</text>
<rect x="20" y="42" width="150" height="46" rx="4" fill="#dbe9f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="95.0" y="65.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">tinyshakespeare.txt</text>
<text x="95.0" y="101" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal" dominant-baseline="middle">约 111 万字符</text>
<line x1="170" y1="65" x2="208" y2="65" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="210" y="42" width="150" height="46" rx="4" fill="#efeeea" stroke="#52514e" stroke-width="1.5"/>
<text x="285.0" y="65.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">CharTokenizer</text>
<text x="285.0" y="101" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal" dominant-baseline="middle">每个字符 → 一个编号 (65 种)</text>
<line x1="360" y1="65" x2="398" y2="65" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="400" y="42" width="170" height="46" rx="4" fill="#dbe9f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="485.0" y="65.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">[18, 47, 56, 57, ...]</text>
<text x="485.0" y="101" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal" dominant-baseline="middle">整篇语料变成一串整数</text>
<line x1="570" y1="65" x2="608" y2="65" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="610" y="42" width="170" height="46" rx="4" fill="#dbe9f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="695.0" y="65.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">切块: x 与 y</text>
<text x="695.0" y="101" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal" dominant-baseline="middle">y 是 x 右移一格, 都是 (B, S)</text>
<text x="790" y="65" font-size="11" fill="#8a8984" text-anchor="start" font-weight="normal" dominant-baseline="middle">← 第 2 节</text>
<path d="M695,106 L695,124 L95,124 L95,152" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="20" y="140" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle">模型 (GPT.forward)</text>
<rect x="20" y="155" width="150" height="52" rx="4" fill="#efeeea" stroke="#52514e" stroke-width="1.5"/>
<text x="95.0" y="181.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">wte(x) + wpe(位置)</text>
<text x="95.0" y="220" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal" dominant-baseline="middle">(B, S, C)   第 4 节</text>
<line x1="170" y1="181" x2="208" y2="181" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="210" y="150" width="300" height="62" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/>
<text x="360" y="166" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle">Block × n_layer</text>
<text x="360" y="186" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">x = x + Attn(LN(x))   ← 第 5、7 节</text>
<text x="360" y="203" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">x = x + FFN(LN(x))    ← 第 6、7 节</text>
<line x1="510" y1="181" x2="548" y2="181" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="550" y="155" width="150" height="52" rx="4" fill="#efeeea" stroke="#52514e" stroke-width="1.5"/>
<text x="625.0" y="181.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">LN → lm_head</text>
<text x="625.0" y="220" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal" dominant-baseline="middle">(B, S, V) 每个位置的打分</text>
<line x1="700" y1="181" x2="738" y2="181" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="740" y="155" width="170" height="52" rx="4" fill="#fde3d7" stroke="#eb6834" stroke-width="1.5"/>
<text x="825.0" y="181.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">cross_entropy(logits, y)</text>
<text x="825.0" y="220" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal" dominant-baseline="middle">一个标量 loss   第 8 节</text>
<path d="M825,224 C825,255 600,250 600,272" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="20" y="262" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle">更新</text>
<rect x="430" y="274" width="170" height="44" rx="4" fill="#efeeea" stroke="#52514e" stroke-width="1.5"/>
<text x="515.0" y="296.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">loss.backward()</text>
<text x="515.0" y="331" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal" dominant-baseline="middle">算出每个参数的梯度</text>
<line x1="430" y1="296" x2="372" y2="296" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="220" y="274" width="150" height="44" rx="4" fill="#efeeea" stroke="#52514e" stroke-width="1.5"/>
<text x="295.0" y="296.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">梯度裁剪</text>
<text x="295.0" y="331" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal" dominant-baseline="middle">总长度 ≤ 1.0</text>
<line x1="220" y1="296" x2="172" y2="296" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="20" y="274" width="150" height="44" rx="4" fill="#efeeea" stroke="#52514e" stroke-width="1.5"/>
<text x="95.0" y="296.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">AdamW 更新参数</text>
<text x="95.0" y="331" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal" dominant-baseline="middle">学习率按余弦调度</text>
<text x="640" y="296" font-size="11" fill="#8a8984" text-anchor="start" font-weight="normal" dominant-baseline="middle">← 第 10 节</text>
<path d="M20,296 C-5,296 -5,65 18,65" fill="none" stroke="#008300" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="26" y="242" font-size="11" fill="#008300" text-anchor="start" font-weight="normal" dominant-baseline="middle">↑ 重复 max_iters 次</text>
<line x1="20" y1="360" x2="980" y2="360" stroke="#e3e2dd" stroke-width="1"/>
<text x="20" y="388" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle">训练完之后: 生成 (第 11 节)</text>
<rect x="20" y="404" width="130" height="40" rx="4" fill="#dbe9f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="85.0" y="424.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">开头的字符</text>
<line x1="150" y1="424" x2="188" y2="424" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="190" y="404" width="130" height="40" rx="4" fill="#efeeea" stroke="#52514e" stroke-width="1.5"/>
<text x="255.0" y="424.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">整段过一遍模型</text>
<line x1="320" y1="424" x2="358" y2="424" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="360" y="404" width="200" height="40" rx="4" fill="#efeeea" stroke="#52514e" stroke-width="1.5"/>
<text x="460.0" y="424.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">只看最后一个位置的打分</text>
<line x1="560" y1="424" x2="598" y2="424" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="600" y="404" width="170" height="40" rx="4" fill="#fde3d7" stroke="#eb6834" stroke-width="1.5"/>
<text x="685.0" y="424.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle">按温度 / top-k 抽一个</text>
<path d="M685,444 C685,462 85,462 85,446" fill="none" stroke="#008300" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="800" y="424" font-size="12" fill="#008300" text-anchor="start" font-weight="normal" dominant-baseline="middle">接到末尾, 再来一轮</text>
</svg>
